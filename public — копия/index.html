<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ветклиника «Добрый Доктор»</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header"></header>
    <main class="container">
        <h1>Забота о ваших питомцах 🐶🐱</h1>
        <p style="margin-bottom:24px;color:#555;">
            Современная ветеринарная клиника с опытными врачами.
        </p>

        <h2>Популярные услуги</h2>
        <div class="grid" id="popular-services">Загрузка...</div>

        <p style="margin-top:24px;">
            <a class="btn" href="/booking.html">Записаться онлайн</a>
            <a class="btn" href="/services.html"
               style="background:#555;margin-left:8px;">Все услуги</a>
        </p>
    </main>

    <footer class="site-footer">
        <div class="container">© 2025 Ветклиника «Добрый Доктор»</div>
    </footer>

    <script src="/js/main.js"></script>
    <script>
        loadHeader();

        fetch('/api/services')
            .then(r => r.json())
            .then(data => {
                const first3 = data.slice(0, 3);
                document.getElementById('popular-services').innerHTML =
                    first3.map(s => `
                        <div class="card">
                            <h3>${escapeHtml(s.title)}</h3>
                            <p>${escapeHtml(s.description)}</p>
                            <p style="margin-top:8px;color:#2e8b57;font-weight:600;">
                                ${formatPrice(s.price)}
                            </p>
                        </div>
                    `).join('');
                animateCards();
            })
            .catch(() => {
                document.getElementById('popular-services').innerHTML =
                    '<p>Ошибка загрузки данных.</p>';
            });
    </script>
</body>
</html>
